services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobqueue
      POSTGRES_USER: jobqueue
      POSTGRES_PASSWORD: jobqueue
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobqueue -d jobqueue"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment: &app-env
      DB_URL: jdbc:postgresql://postgres:5432/jobqueue
      DB_USER: jobqueue
      DB_PASSWORD: jobqueue
      JOBQUEUE_ROLES: api
    ports: ["${API_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  # Scale with: docker compose up --scale worker=4
  worker:
    build: .
    image: durable-job-queue:local
    environment:
      <<: *app-env
      JOBQUEUE_ROLES: worker
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_started }   # api owns the first Flyway run in practice; migrations are lock-safe anyway

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
