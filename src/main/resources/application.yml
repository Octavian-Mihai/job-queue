spring:
  lifecycle:
    # Must exceed jobqueue.worker.shutdown-grace-period (30s) plus a few seconds to release leases.
    timeout-per-shutdown-phase: 45s
  application:
    name: durable-job-queue
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobqueue}
    username: ${DB_USER:jobqueue}
    password: ${DB_PASSWORD:jobqueue}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration

jobqueue:
  # Comma-separated: api, worker. Default (unset) = both, handy for local runs.
  roles: ${JOBQUEUE_ROLES:api,worker}
  worker-id: ${JOBQUEUE_WORKER_ID:}

  # Retry policy. Delay after failed attempt n is uniform in [0, min(max-delay, base-delay * multiplier^(n-1))].
  retry:
    defaults:
      base-delay: 2s
      multiplier: 2.0
      max-delay: 5m
      max-attempts: 5
      execution-timeout: 5m
    types:
      send-email:
        base-delay: 500ms
        max-delay: 30s
      deliver-webhook:
        base-delay: 1s
        max-delay: 1m
        max-attempts: 8
        execution-timeout: 30s
      generate-report:
        max-attempts: 3
        base-delay: 5s
        execution-timeout: 10m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [job_id=%X{job_id:-} worker_id=%X{worker_id:-}]"
