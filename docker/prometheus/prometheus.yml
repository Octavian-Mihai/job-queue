global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
  # Compose DNS returns one A record per scaled replica; Prometheus discovers them all.
  - job_name: worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8080
        refresh_interval: 5s
