name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Format check (Spotless)
        run: ./mvnw -B spotless:check
      - name: Build, test (Testcontainers), coverage report
        run: ./mvnw -B verify
      - name: Upload crash-recovery worker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-recovery-logs
          path: target/crash-recovery
          if-no-files-found: ignore
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
      - name: Build Docker image
        run: docker build -t durable-job-queue:ci .
